<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Komik — Health Toon</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hijau-utama: #387B62; --hijau-gelap: #263B32; --beige: #E4CFA8; --putih-hangat: #FFF9ED; }
        body { margin: 0; font-family: 'Nunito', sans-serif; background-color: var(--putih-hangat); color: var(--hijau-gelap); line-height: 1.6; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        
        header { background-color: var(--putih-hangat); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; color: var(--hijau-utama); display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 40px; height: 40px; background-color: var(--hijau-utama); color: white; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; }
        nav ul { list-style: none; display: flex; gap: 30px; margin: 0; padding: 0; }
        nav ul li a { text-decoration: none; color: var(--hijau-gelap); font-weight: 600; transition: color 0.3s; }
        nav ul li a:hover { color: var(--hijau-utama); }
        .btn-nav { background-color: var(--hijau-utama); color: white !important; padding: 10px 20px; border-radius: 25px; }

        .container { padding: 50px; max-width: 1000px; margin: 0 auto; }
        .container h1 { font-size: 40px; color: var(--hijau-utama); margin-bottom: 30px; text-align: center; }
        
        .grid-komik { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
        .kartu-komik { background-color: white; border: 2px dashed var(--hijau-gelap); border-radius: 20px; width: 300px; overflow: hidden; text-align: center; padding-bottom: 20px; }
        
        /* GAMBAR KOMIK SEMENTARA */
        .gambar-komik { width: 100%; height: 200px; background-color: var(--beige); display: flex; justify-content: center; align-items: center; color: var(--hijau-gelap); font-weight: bold; }
        .gambar-komik img { width: 100%; height: 100%; object-fit: cover; }
        
        .kartu-komik h3 { margin: 15px 0 10px; font-size: 20px; }
        .btn-baca { background-color: var(--hijau-utama); color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 15px; gap: 15px; }
            nav ul { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo"><div class="logo-icon">+</div> Health Toon</a>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="tentang.html">Tentang</a></li>
                <li><a href="galeri.html" style="color: var(--hijau-utama);">Galeri Komik</a></li>
                <li><a href="kontak.html">Kontak</a></li>
                <li><a href="galeri.html" class="btn-nav">Baca Komik</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Galeri Komik</h1>
        <div class="grid-komik">
            <div class="kartu-komik">
                <div class="gambar-komik">
                    <!-- GANTI BAGIAN INI DENGAN GAMBAR KOMIK 1 -->
                    <!-- Contoh: <img src="komik1.jpg." alt="Komik 1"> -->
                    <img src="komik1.jpg.jpg" alt="Komik 1">

                </div>
                <h3>Rahasia Tidur Nyenyak</h3>
                <a href="read.html" class="btn-baca">Baca Episode</a>
            </div>
            
            <div class="kartu-komik">
                <div class="gambar-komik">
                    <img src="komik2.jpg.jpg" alt="Komik 2">
                </div>
                <h3>Pahlawan Sayur Hijau</h3>
                <a href="read2.html" class="btn-baca">Baca Episode</a>
            </div>
            <div class="kartu-komik">
                <div class="gambar-komik">
                    <!-- GANTI BAGIAN INI DENGAN GAMBAR KOMIK 3 -->
                    <img src="komik3.jpg.jpg" alt="Komik 3">
                </div>
                <h3>Lawan Stres dengan Senyum</h3>
                <a href="read3.html" class="btn-baca">Baca Episode</a>            
        </div>
    </div>
</body>
</html>
