<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Health Toon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--hijau:#387B62;--hijau-gelap:#263B32;--beige:#E4CFA8;--putih:#FFF9ED;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background-color:var(--putih);color:var(--hijau-gelap);height:100vh;display:flex;justify-content:center;align-items:center;background-image:radial-gradient(circle at 20% 30%, rgba(228,207,168,0.3) 0%, transparent 40%);}
.login-card{background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(38,59,50,0.1);width:100%;max-width:400px;text-align:center;border:2px solid var(--beige);}
.logo{font-family:'Poppins',sans-serif;font-weight:700;font-size:28px;color:var(--hijau);display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;}
.logo-icon{width:40px;height:40px;background-color:var(--hijau);color:white;border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:20px;font-weight:bold;}
h2{margin-bottom:30px;color:var(--hijau-gelap);}
.input-group{text-align:left;margin-bottom:20px;}
.input-group label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;}
.input-group input{width:100%;padding:12px 15px;border:2px solid var(--beige);border-radius:10px;font-family:'Nunito',sans-serif;font-size:16px;outline:none;transition:0.3s;}
.input-group input:focus{border-color:var(--hijau);}
.btn-login{width:100%;padding:15px;background-color:var(--hijau);color:white;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:bold;cursor:pointer;transition:0.3s;margin-top:10px;}
.btn-login:hover{background-color:var(--hijau-gelap);}
.register-link{margin-top:20px;font-size:14px;}
.register-link a{color:var(--hijau);font-weight:bold;text-decoration:none;}
</style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">+</div> Health Toon
    </div>
    <h2>Selamat Datang Kembali!</h2>
    
    <form action="index.html">
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="nama@email.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Masuk</button>
    </form>
    
    <div class="register-link">
      Belum punya akun? <a href="#">Daftar di sini</a>
    </div>
  </div>

</body>
</html>
